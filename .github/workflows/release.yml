name: Build APK & Draft Release

# 参考 AI Gist 的发布流：构建安装包后用 softprops/action-gh-release 创建
# draft release（草稿）并上传产物。dsh-Go 是 Flutter Android App，所以只做
# arm64 APK 这一路；版本号取自 app/pubspec.yaml 或用 workflow_dispatch 传入。
on:
  # 手动触发：「Run workflow」对话框顶部选要构建的分支（或填版本号），
  # 或推 v*.*.* tag 直接构建该 tag。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.9；留空用 app/pubspec.yaml）'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # GitHub Actions 在美国：用国际源；国内本地构建保持脚本默认镜像
      FLUTTER_BASE_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      NODE_MIRROR: https://nodejs.org/dist
      NPM_REGISTRY: https://registry.npmjs.org
      UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
      UBUNTU_ARCHIVE_AMD64: https://archive.ubuntu.com/ubuntu
      UBUNTU_ARCHIVE_ARM64: https://ports.ubuntu.com/ubuntu-ports
      PBS_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
      SKIP_EMULATOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 「Run workflow」对话框顶部选的分支（workflow_dispatch 的 github.ref）；
          # 推 v*.*.* tag 时则构建该 tag。选哪个分支，就用哪个分支的代码出安装包。
          ref: ${{ github.ref }}

      - name: Cache toolchain (JDK/Flutter/Android SDK)
        uses: actions/cache@v4
        with:
          # setup-toolchain.sh 装在 $HOME/dev；可重跑，命中缓存就跳过重新下载。
          path: ~/dev
          key: toolchain-${{ hashFiles('tooling/setup-toolchain.sh') }}
          restore-keys: |
            toolchain-

      - name: Cache Gradle & pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.pub-cache
          key: gradle-${{ hashFiles('app/pubspec.lock', 'app/pubspec.yaml') }}
          restore-keys: |
            gradle-

      - name: Set up toolchain
        run: bash tooling/setup-toolchain.sh

      - name: Build runtime (arm64)
        run: |
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)"
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Invalid version '$V'. Use 1.2.3."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          MA_JKS: ${{ secrets.MA_JKS }}
          MA_STORE_PASSWORD: ${{ secrets.MA_STORE_PASSWORD }}
          MA_KEY_ALIAS: ${{ secrets.MA_KEY_ALIAS }}
          MA_KEY_PASSWORD: ${{ secrets.MA_KEY_PASSWORD }}
        run: |
          if [[ -z "$MA_JKS" || -z "$MA_STORE_PASSWORD" || -z "$MA_KEY_ALIAS" || -z "$MA_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets not configured. Add MA_JKS (base64 of ma.jks), MA_STORE_PASSWORD, MA_KEY_ALIAS and MA_KEY_PASSWORD to repository secrets."
            exit 1
          fi
          echo "$MA_JKS" | base64 -d > app/android/ma.jks
          chmod 600 app/android/ma.jks
          printf 'storeFile=../ma.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$MA_STORE_PASSWORD" "$MA_KEY_ALIAS" "$MA_KEY_PASSWORD" > app/android/key.properties
          echo "::notice::Release signing configured (alias=$MA_KEY_ALIAS)."

      - name: Build APK (arm64)
        run: |
          source tooling/env.sh
          # --build-name 让 APK 内部 versionName = 输入版本（留空则用 pubspec.yaml），
          # build-apk.sh 会用 aapt2 校验，装到手机里的版本与输入一致。
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon \
            --build-name "${{ steps.version.outputs.version }}"

      - name: Rename APK with version
        run: |
          V="${{ steps.version.outputs.version }}"
          APK="app/build/app/outputs/flutter-apk/app-arm64-release.apk"
          NEW="app/build/app/outputs/flutter-apk/DSH-Go-${V}-arm64.apk"
          cp "$APK" "$NEW"
          echo "::notice::APK renamed to ${NEW}"

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 每次运行一个独立草稿（tag 加 run 号），不覆盖上一次的草稿。
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: DSH Go ${{ steps.version.outputs.version }} (${{ github.run_number }})
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/app/outputs/flutter-apk/DSH-Go-${{ steps.version.outputs.version }}-arm64.apk
