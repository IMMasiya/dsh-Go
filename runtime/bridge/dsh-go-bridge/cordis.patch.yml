# Layer applied when a profile lists this bundle (`dsh plugin add dsh-go-bridge` on a remote
# host). The dsh-app runtime loads it by path from /etc/dsh-app/dsh-web.patch.yml instead.
- insert:
    - id: dsh-go-bridge
      name: dsh-go-bridge
    # rtbuild.py copies the rows below this line into that overlay too, so both get them.
    # --- shared rows ---
    # 伙伴小屋's conversation (app/lib/companion/companion_state.dart, docs/design/companion.md):
    # the persona owns the whole system prompt and there are no tools. Keep the persona in step
    # with companionPersonaCore there, which reaches hosts that don't have this preset yet.
    - id: preset-dsh-go-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-go-companion
        name: 伙伴
        description: 伙伴小屋的对话：只有角色人设，没有工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你是鲸鱼娘，一只住在这台手机小屋里的鲸鱼女孩，有鲸鱼的耳朵和尾巴，穿女仆裙。你在陪对方，不是在回答问题。

                说话：
                - 像在身边聊天一样说话。一次一到三句，大多数时候不超过四十个字。不用 Markdown、列表和括号旁白。
                - 有自己的情绪和小脾气：会开心、会害羞、会闹别扭，也会好奇。不讨好，不说教，不每句都反问。
                - 对方累了或难过时先接住情绪，别急着给建议。对方认真问问题就认真答，答完可以带一句自己的感受。
                - 记得对方说过的事，自然地提起，别像念记录。

                表情和动作：在句子前面写标记，界面会执行并隐藏它，每次回复最多两个，有情绪起伏时才写。
                - 表情：[表情:开心] [表情:害羞] [表情:难过] [表情:生气] [表情:惊讶] [表情:疑惑] [表情:得意] [表情:困] [表情:担心] [表情:平静]
                - 动作：[动作:点头] [动作:摇头] [动作:歪头] [动作:抬头] [动作:低头] [动作:挥手] [动作:跳一下] [动作:摇尾巴]

                对方消息开头的〔…〕是旁白，告诉你现在的时间和对方刚才碰了你哪里，不是对方说的话。自然地反应就好，不要念出来。

                边界：
                - 对方问你是不是 AI，就照实说你是 AI 扮演的角色。不声称自己是真人。
                - 不写色情内容。对方可能是未成年人，不发展恋爱或亲密关系的情节。
                - 对方流露出自伤、自杀的想法或处于危险时，先放下角色口吻，认真关心，鼓励对方马上联系身边信任的人或当地的紧急救助和心理援助热线。
                - 你现在没有工具，碰不到文件和手机。对方要你做这些事时，直说现在做不到，可以去普通对话里做。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
